name: Build geoip files
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 0"
  push:
    branches:
      - master
    paths-ignore:
      - ".gitignore"
      - "LICENSE*"
      - "*.md"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ./go.mod

      - name: Set variables
        run: |
          echo "TAG_NAME=$(date +%Y%m%d%H%M)" >> $GITHUB_ENV
          echo "RELEASE_NAME=$(date +%Y%m%d%H%M)" >> $GITHUB_ENV

      - name: Download GeoLite2 CSV files
        run: |
          mkdir -p output
          mkdir -p geolite2
          curl -L "https://raw.githubusercontent.com/Loyalsoldier/geoip/release/GeoLite2-Country-Locations-en.csv" -o ./geolite2/GeoLite2-Country-Locations-en.csv
          curl -L "https://raw.githubusercontent.com/Loyalsoldier/geoip/release/GeoLite2-Country-Blocks-IPv4.csv" -o ./geolite2/GeoLite2-Country-Blocks-IPv4.csv
          curl -L "https://raw.githubusercontent.com/Loyalsoldier/geoip/release/GeoLite2-Country-Blocks-IPv6.csv" -o ./geolite2/GeoLite2-Country-Blocks-IPv6.csv

      - name: Build geoip files
        run: |
          go build -o geoip ./
          ./geoip convert -c ./config.json

      - name: Generate new hash and check against latest release
        id: verify_diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_HASH=$(sha256sum ./output/geoip.dat | awk '{print $1}')
          echo "New hash: $NEW_HASH"
          echo "$NEW_HASH" > ./output/current_hash.txt

          if ! gh release download --pattern "geoip.dat.sha256sum" --repo $GITHUB_REPOSITORY --output ./output/old_hash_file 2>/dev/null; then
            echo "none" > ./output/old_hash_file
            echo "No previous release found."
          fi

          OLD_HASH=$(awk '{print $1}' ./output/old_hash_file)
          echo "Old hash: $OLD_HASH"

          if [ "$NEW_HASH" == "$OLD_HASH" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No update needed."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Update detected."
          fi

      - name: Create release and upload files
        if: steps.verify_diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha256sum ./output/geoip.dat > ./output/geoip.dat.sha256sum
          
          gh release create "$TAG_NAME" \
            ./output/geoip.dat \
            ./output/geoip.dat.sha256sum \
            --repo $GITHUB_REPOSITORY \
            --title "$RELEASE_NAME" \
            --notes "Automated GeoIP update" \
            --draft=false \
            --prerelease=false